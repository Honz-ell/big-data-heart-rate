services:
  kafka:
    image: apache/kafka:4.4.0
    container_name: wesad-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: kafka
      KAFKA_JMX_OPTS: -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: wesad-postgres
    environment:
      POSTGRES_DB: wesad
      POSTGRES_USER: wesad
      POSTGRES_PASSWORD: wesad_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wesad -d wesad"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  model-registry:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: wesad-model-registry
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: wesad
      DB_USER: wesad
      DB_PASSWORD: wesad_dev_password
      MODEL_STORAGE_DIR: /app/models
    volumes:
      - ./models:/app/models
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    container_name: wesad-grafana
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboard-provider.yaml:/etc/grafana/provisioning/dashboards/provider.yaml:ro
      - ./grafana:/var/lib/grafana/dashboards:ro
    restart: unless-stopped

  kafka-jmx-exporter:
    profiles: ["monitoring"]
    build:
      context: ./grafana
      dockerfile: jmx-exporter.Dockerfile
    container_name: wesad-kafka-jmx-exporter
    depends_on:
      kafka:
        condition: service_healthy
    expose:
      - "9404"
    restart: unless-stopped

  cadvisor:
    profiles: ["monitoring"]
    image: ghcr.io/google/cadvisor:0.55.1
    container_name: wesad-cadvisor
    privileged: true
    command: ["--docker_only=true"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    expose:
      - "8080"
    restart: unless-stopped

  spark-aggregator:
    profiles: ["monitoring"]
    image: apache/spark:4.3.0-java21-python3
    container_name: wesad-spark
    entrypoint: ["/opt/spark/bin/spark-submit"]
    command:
      - --master
      - "local[*]"
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.13:4.3.0,org.postgresql:postgresql:42.7.14
      - --conf
      - spark.sql.adaptive.enabled=false
      - --conf
      - spark.jars.ivy=/tmp/.ivy2
      - --conf
      - spark.sql.streaming.metricsEnabled=true
      - /opt/project/src/spark/aggregate_stream.py
      - --broker
      - kafka:29092
      - --topic
      - wearable.sensor.v1
      - --starting-offsets
      - earliest
      - --watermark
      - "15 seconds"
      - --checkpoint-location
      - /opt/project/checkpoints/spark-postgres-v2
      - --metrics-host
      - 0.0.0.0
      - --metrics-port
      - "9095"
    environment:
      WESAD_DB_PASSWORD: wesad_dev_password
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./:/opt/project
    working_dir: /opt/project
    ports:
      - "127.0.0.1:4040:4040"
    expose:
      - "9095"
    restart: unless-stopped

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.16.0
    container_name: wesad-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    depends_on:
      - kafka-jmx-exporter
      - cadvisor
      - spark-aggregator
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./grafana/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

volumes:
  postgres-data:
  grafana-data:
  prometheus-data:
