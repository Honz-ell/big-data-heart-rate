global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: kafka-jmx
    static_configs:
      - targets: ["kafka-jmx-exporter:9404"]

  - job_name: spark
    metrics_path: /metrics
    static_configs:
      - targets: ["spark-aggregator:9095"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
